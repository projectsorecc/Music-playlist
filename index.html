<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Keroncong Player</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #060608; /* Hitam pekat OLED friendly agar hemat baterai */
            color: #ffffff;
            min-height: 100vh; /* PERBAIKAN: Menggunakan min-height agar elastis */
            display: flex;
            flex-direction: column; /* Mengubah arah layout agar footer bisa di bawah */
            justify-content: space-between; /* PERBAIKAN: Memaksa footer berada di ujung bawah bodi */
            align-items: center;
            padding: 30px 20px 10px 20px; /* Jarak padding disesuaikan */
            position: relative;
        }

        /* Latar belakang pendaran cahaya emas estetik */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #c9924a, #85581A);
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            z-index: 1;
            top: 20%;
        }

        /* Wadah Utama Glassmorphism Premium */
        .player-card {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 360px;
            padding: 45px 28px;
            border-radius: 32px;
            text-align: center;
            border: 1px solid rgba(201, 146, 74, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            z-index: 2;
            margin: auto 0; /* Menjaga kartu tetap tepat di tengah ruang kosong */
        }

        /* Lingkaran Audio Avatar */
        .audio-wave-avatar {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #16161a, #232329);
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            position: relative;
            border: 2px solid rgba(201, 146, 74, 0.3);
            box-shadow: 0 0 30px rgba(201, 146, 74, 0.1);
        }

        /* Efek Gelombang Riak Neon */
        .audio-wave-avatar::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #c9924a;
            opacity: 0;
            box-shadow: 0 0 20px #c9924a;
            animation: ripple 2s infinite ease-out;
            animation-play-state: paused;
            box-sizing: border-box;
        }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        /* Judul Lagu & Artis */
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, #e5d5c5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            font-size: 0.9rem;
            color: #8e8e93;
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Kotak Status Informasi */
        #status-box {
            font-size: 0.75rem;
            color: #c9924a;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(201, 146, 74, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 35px;
            background: rgba(201, 146, 74, 0.05);
            transition: all 0.3s;
        }

        /* Tombol Play Besar */
        .btn-play {
            background: linear-gradient(135deg, #c9924a, #a67332);
            color: #ffffff;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(201, 146, 74, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            transition: all 0.2s ease;
        }
        .btn-play:active {
            transform: scale(0.92);
            box-shadow: 0 4px 10px rgba(201, 146, 74, 0.2);
        }

        /* Trik Hemat Kuota: Video dikecilkan 1x1 piksel tak terlihat */
        .hidden-holder {
            width: 1px;
            height: 1px;
            position: absolute;
            bottom: 0;
            left: 0;
            opacity: 0.001;
            overflow: hidden;
        }

        /* ====================================================
           GAYA TOMBOL PORTOFOLIO
           ==================================================== */
        .portfolio-wrapper {
            position: fixed;
            bottom: 65px; /* Disesuaikan agar posisinya pas di atas footer baru */
            right: 25px;
            display: flex;
            align-items: center;
            z-index: 999;
        }

        /* Tombol fisik utama 46px */
        .portfolio-float-btn {
            position: relative;
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #c9924a, #85581A);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(201, 146, 74, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            z-index: 2;
            transition: transform 0.3s ease;
            animation: button-heartbeat 2s infinite ease-in-out;
        }

        /* Lapisan pendaran detak */
        .portfolio-float-btn::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 100%;
            height: 100%;
            border: 1px solid #c9924a;
            background: rgba(201, 146, 74, 0.25);
            border-radius: 50%;
            z-index: -1;
            transform: scale(1);
            transform-origin: center;
            animation: gold-pulse 2s infinite ease-out;
            box-sizing: content-box;
        }

        /* Desain Ikon dengan transisi putar halus */
        .portfolio-float-btn .material-symbols-outlined {
            font-size: 21px; 
            color: #ffffff;
            user-select: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Teks "Kunjungi Pembuat" */
        .portfolio-text {
            background: rgba(18, 18, 22, 0.95);
            border: 1px solid rgba(201, 146, 74, 0.3);
            color: #e5d5c5;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 8px 16px;
            padding-right: 28px;
            border-radius: 20px 0 0 20px;
            margin-right: -18px;
            text-decoration: none; 
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            white-space: nowrap;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: -5px 5px 15px rgba(0,0,0,0.4);
        }

        /* EFEK KONDISI AKTIF (SAAT DIKLIK) */
        .portfolio-wrapper.active .portfolio-float-btn {
            animation: none; 
            transform: scale(1) !important;
        }

        .portfolio-wrapper.active .portfolio-float-btn .material-symbols-outlined {
            transform: rotate(360deg);
        }

        .portfolio-wrapper.active .portfolio-text {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* Animasi Hentakan Tombol Utama */
        @keyframes button-heartbeat {
            0%, 100% { transform: scale(1); }
            20% { transform: scale(1.08); }
            40% { transform: scale(0.96); }
            60% { transform: scale(1.04); }
        }

        /* Animasi Pendaran Radius Emas */
        @keyframes gold-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            40% { transform: scale(1.25); opacity: 0.4; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* ====================================================
           GAYA BAGIAN FOOTER (HAK CIPTA FIXED)
           ==================================================== */
        footer {
            width: 100%;
            text-align: center;
            padding: 10px 0;
            font-size: 0.75rem;
            color: #4a4a4f; /* Abu-abu oled friendly */
            letter-spacing: 0.8px;
            z-index: 2;
            background: transparent;
            flex-shrink: 0; /* PERBAIKAN: Mencegah Chrome mengecilkan baris footer menjadi 0px */
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="audio-wave-avatar" id="avatar-glow">📻</div>
        
        <h1>Keroncong Tempo Dulu</h1>
        <div class="sub">Nostalgia Musik Indonesia</div>

        <div id="status-box">SIAP DIPUTAR</div>

        <div class="controls">
            <button class="btn-play" onclick="toggleMulai()" id="btn-play">PLAY</button>
        </div>
    </div>

    <div class="portfolio-wrapper" id="portfolio-container">
        <a href="https://projectsorecc.github.io/Portofolio/" class="portfolio-text" target="_blank" id="portfolio-link">portfolio saya</a>
        
        <div class="portfolio-float-btn" onclick="aksiTombol(event)">
            <span class="material-symbols-outlined">contact_page</span>
        </div>
    </div>

    <div class="hidden-holder">
        <div id="secret-player"></div>
    </div>

    <footer>
        &copy; 2026 Projectsorecc. All Rights Reserved.
    </footer>

    <script>
        function aksiTombol(event) {
            event.stopPropagation(); 
            var wadah = document.getElementById('portfolio-container');
            
            if (!wadah.classList.contains('active')) {
                wadah.classList.add('active');
            } else {
                document.getElementById('portfolio-link').click();
                wadah.classList.remove('active');
            }
        }

        document.addEventListener('click', function(e) {
            var wadah = document.getElementById('portfolio-container');
            if (wadah.classList.contains('active')) {
                wadah.classList.remove('active');
            }
        });

        // ====================================================
        // SISTEM ENGINE AUDIO PLAYER YOUTUBE
        // ====================================================
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var playing = false;
        var videoId = "FSrXrWoHQHY"; 
        var antiTidurInterval; 

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('secret-player', {
                height: '1',
                width: '1',
                videoId: videoId,
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onStateChange
                }
            });
        }

        function onPlayerReady(event) {
            if(player.setPlaybackQuality) {
                player.setPlaybackQuality('small'); 
            }
        }

        function toggleMulai() {
            if (!player) return;
            if (!playing) {
                player.playVideo();
                if(player.setPlaybackQuality) player.setPlaybackQuality('small');
            } else {
                player.pauseVideo();
            }
        }

        function onStateChange(event) {
            const statusBox = document.getElementById('status-box');
            const btnPlay = document.getElementById('btn-play');

            if (event.data == YT.PlayerState.PLAYING) {
                playing = true;
                statusBox.innerText = "MEMUTAR • HEMAT DATA";
                statusBox.style.color = "#c9924a";
                statusBox.style.borderColor = "rgba(201, 146, 74, 0.6)";
                statusBox.style.background = "rgba(201, 146, 74, 0.1)";
                btnPlay.innerText = "PAUSE";
                btnPlay.style.background = "linear-gradient(135deg, #222, #111)";
                btnPlay.style.border = "2px solid #c9924a";
                btnPlay.style.boxShadow = "0 8px 25px rgba(0, 0, 0, 0.5)";
                
                var sheet = window.document.styleSheets[0];
                sheet.insertRule('.audio-wave-avatar::after { animation-play-state: running !important; }', sheet.cssRules.length);

                clearInterval(antiTidurInterval);
                antiTidurInterval = setInterval(function() {
                    if (player && player.getPlayerState() === YT.PlayerState.PAUSED && playing) {
                        player.playVideo(); 
                        if(player.setPlaybackQuality) player.setPlaybackQuality('small');
                    }
                }, 8000);

            } else if (event.data == YT.PlayerState.PAUSED) {
                if (playing) { 
                    clearInterval(antiTidurInterval);
                }
                playing = false;
                statusBox.innerText = "MUSIK DIJEDA";
                statusBox.style.color = "#8e8e93";
                statusBox.style.borderColor = "rgba(255, 255, 255, 0.1)";
                statusBox.style.background = "transparent";
                btnPlay.innerText = "PLAY";
                btnPlay.style.background = "linear-gradient(135deg, #c9924a, #a67332)";
                btnPlay.style.border = "none";
                btnPlay.style.boxShadow = "0 8px 25px rgba(201, 146, 74, 0.4)";
                
                var sheet = window.document.styleSheets[0];
                sheet.insertRule('.audio-wave-avatar::after { animation-play-state: paused !important; }', sheet.cssRules.length);
                
            } else if (event.data == YT.PlayerState.BUFFERING) {
                statusBox.innerText = "MEMUAT AUDIO...";
                statusBox.style.color = "#ffffff";
            }
        }
    </script>
</body>
</html>
